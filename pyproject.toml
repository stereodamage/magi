[project]
name = "magi"
version = "0.1.0"
description = "MAGI review council: three model personas deliberate over your diff"
readme = "README.md"
authors = [
    { name = "stereodamage", email = "stereoad@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
magi = "magi.tui:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
